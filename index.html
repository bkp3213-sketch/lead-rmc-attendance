<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>LEAD RMC Attendance</title>

<script src="https://cdn.jsdelivr.net/npm/@vladmandic/face-api@1.7.15/dist/face-api.min.js"></script>

<style>
*{box-sizing:border-box}
body{
  margin:0;
  font-family:Arial,Helvetica,sans-serif;
  background:#f3f6fa;
  color:#172033;
}
.container{
  width:min(430px,94%);
  margin:25px auto;
}
.card{
  background:white;
  border-radius:20px;
  padding:22px;
  box-shadow:0 8px 30px rgba(0,0,0,.10);
}
.header{
  text-align:center;
  margin-bottom:18px;
}
.logo{
  width:84px;
  height:84px;
  border-radius:20px;
  object-fit:cover;
  display:block;
  margin:0 auto 12px;
}
h1{font-size:24px;margin:0 0 5px}
.subtitle{color:#687386;font-size:14px}
.camera{
  position:relative;
  width:100%;
  aspect-ratio:4/3;
  background:#111;
  border-radius:16px;
  overflow:hidden;
  margin:18px 0;
}
video{
  width:100%;
  height:100%;
  object-fit:cover;
  transform:scaleX(-1);
}
.face-box{
  position:absolute;
  left:12%;
  top:10%;
  width:76%;
  height:80%;
  border:2px solid rgba(255,255,255,.8);
  border-radius:45%;
  pointer-events:none;
}
.status{
  background:#f4f7fb;
  border-radius:12px;
  padding:13px;
  text-align:center;
  font-size:14px;
  line-height:1.5;
  margin:14px 0;
}
.status.success{background:#e9f8ef;color:#16713a}
.status.error{background:#fff0f0;color:#a52121}
.buttons{display:grid;gap:10px}
button{
  width:100%;
  border:0;
  border-radius:12px;
  padding:14px;
  font-size:16px;
  font-weight:700;
  cursor:pointer;
}
button:disabled{opacity:.55;cursor:not-allowed}
.checkin{background:#198754;color:white}
.checkout{background:#dc3545;color:white}
.info{
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:10px;
  margin-top:14px;
}
  .manual{
  background:#f0ad4e;
  color:white;
}
.info-box{
  background:#f7f8fa;
  border-radius:12px;
  padding:10px;
  text-align:center;
}
.label{font-size:11px;color:#7b8492}
.value{font-size:13px;font-weight:700;margin-top:3px}
.note{
  text-align:center;
  color:#7a8492;
  font-size:12px;
  margin-top:15px;
}
</style>

<style id="lead-rmc-logo-style">
.company-logo {
  display: block;
  width: 170px;
  max-width: 55%;
  height: auto;
  object-fit: contain;
  margin: 0 auto 10px;
}
@media (max-width: 600px) {
  .company-logo {
    width: 150px;
    max-width: 52%;
  }
}
</style>

</head>

      <h1>LEAD RMC</h1>
      <div class="subtitle">Employee Attendance</div>
    </div>

    <div class="camera">
      <video id="video" autoplay muted playsinline></video>
      <div class="face-box"></div>
    </div>

    <div id="status" class="status">
      ⏳ Loading face recognition...
    </div>

    <div class="buttons">
      <button
        id="manualBtn"
        class="manual"
        onclick="manualVerification()"
        style="display:none;">
        🆘 MANUAL VERIFICATION
      </button>
    </div>

    <div class="info">
      <div class="info-box">
        <div class="label">OFFICE</div>
        <div class="value">LEAD RMC</div>
      </div>
      <div class="info-box">
        <div class="label">ALLOWED RADIUS</div>
        <div class="value">50 metres</div>
      </div>
    </div>

    <div class="note">
      Face verification and office location are required for attendance.
    </div>

  </div>

<script>
const APPS_SCRIPT_URL =
  "https://script.google.com/macros/s/AKfycbwVkeLVCtXD9GW42p9V7BZ-ST6p60LfrD6koc4p8D4u035hKaoB7dgFSUNG_XidBOfi/exec";

const MODEL_URLS = [
  "https://cdn.jsdelivr.net/npm/@vladmandic/face-api@1.7.15/model/",
  "https://unpkg.com/@vladmandic/face-api@1.7.15/model/"
];

const OFFICE_LAT = 18.6094356;
const OFFICE_LNG = 73.9188644;
const ALLOWED_RADIUS = 50;

let cameraStream = null;
let appReady = false;
let busy = false;
let scanTimer = null;
let waitingForFaceToLeave = false;
let noFaceSince = 0;
let autoScanStopped = false;
let lastScanTime = 0;

// Face verification attempts
let faceAttempts = 0;
const MAX_FACE_ATTEMPTS = 3;
const SCAN_INTERVAL = 1200;
const SCAN_COOLDOWN = 3000;

const statusEl = document.getElementById("status");
const video = document.getElementById("video");

function setStatus(message, type = "") {
  statusEl.className = "status " + type;
  statusEl.innerHTML = message;
}

async function loadModels() {
  for (const url of MODEL_URLS) {
    try {
      setStatus("⏳ Loading face recognition models...");
      await faceapi.nets.tinyFaceDetector.loadFromUri(url);
      await faceapi.nets.faceLandmark68TinyNet.loadFromUri(url);
      await faceapi.nets.faceRecognitionNet.loadFromUri(url);
      return;
    } catch (error) {
      console.warn("Model URL failed:", url, error);
    }
  }
  throw new Error("Face recognition models could not be loaded.");
}

async function startCamera() {
  if (!navigator.mediaDevices || !navigator.mediaDevices.getUserMedia) {
    throw new Error("Camera is not supported by this browser.");
  }

  cameraStream = await navigator.mediaDevices.getUserMedia({
    video: {
      facingMode: "user",
      width: { ideal: 640 },
      height: { ideal: 480 }
    },
    audio: false
  });

  video.srcObject = cameraStream;

  await new Promise(resolve => {
    if (video.readyState >= 2) resolve();
    else video.onloadedmetadata = resolve;
  });
}

async function initialise() {
  try {
    await loadModels();

    setStatus("📷 Starting camera...");
    await startCamera();

    appReady = true;

    setStatus(
      "📷 <b>Ready.</b><br>Face the camera. Attendance will be marked automatically."
    );

    startAutoFaceScan();

  } catch (error) {
    console.error(error);
    setStatus(
      "❌ " + escapeHtml(error.message) +
      "<br>Allow camera access and reload the page.",
      "error"
    );
  }
}

async function captureDescriptor() {
  const detection = await faceapi
    .detectSingleFace(
      video,
      new faceapi.TinyFaceDetectorOptions({
        inputSize: 320,
        scoreThreshold: 0.5
      })
    )
    .withFaceLandmarks(true)
    .withFaceDescriptor();

  if (!detection) {
    return null;
  }

  return Array.from(detection.descriptor);
}

async function postData(params) {
  const body = new URLSearchParams();

  Object.entries(params).forEach(([key, value]) => {
    body.append(key, value);
  });

  const response = await fetch(APPS_SCRIPT_URL, {
    method: "POST",
    headers: {
      "Content-Type": "application/x-www-form-urlencoded"
    },
    body: body.toString()
  });

  const text = await response.text();

  try {
    return JSON.parse(text);
  } catch (error) {
    console.error("Server response:", text);
    throw new Error("Invalid response from attendance server.");
  }
}

async function verifyFace(descriptor) {
  return await postData({
    action: "verifyFace",
    descriptor: JSON.stringify(descriptor)
  });
}

async function getTodayAttendance(employeeId) {
  return await postData({
    action: "getTodayAttendance",
    employeeId: employeeId
  });
}

function getLocation() {
  return new Promise((resolve, reject) => {
    if (!navigator.geolocation) {
      reject(new Error("Location is not supported by this browser."));
      return;
    }

    navigator.geolocation.getCurrentPosition(
      position => resolve(position),
      error => {
        let message = "Unable to get your location.";

        if (error.code === 1) {
          message = "Location permission was denied. Please allow location access.";
        } else if (error.code === 2) {
          message = "Your location could not be determined.";
        } else if (error.code === 3) {
          message = "Location request timed out. Please try again.";
        }

        reject(new Error(message));
      },
      {
        enableHighAccuracy: true,
        timeout: 15000,
        maximumAge: 0
      }
    );
  });
}

async function autoMarkAttendance(faceResult, latitude, longitude, distance) {
  const status = await getTodayAttendance(faceResult.employeeId);

  if (!status.success) {
    throw new Error(status.message || "Unable to check today's attendance.");
  }

  let action = "";
  let actionName = "";

  if (!status.checkedIn) {
    action = "checkIn";
    actionName = "Check In";
  } else if (!status.checkedOut) {
    action = "checkOut";
    actionName = "Check Out";
  } else {
    return {
      success: false,
      alreadyComplete: true,
      message: "Your attendance is already completed for today."
    };
  }

  setStatus(
    "📍 " + Math.round(distance) + " m from office.<br>" +
    "⏳ Saving <b>" + actionName + "</b> automatically..."
  );

  return await postData({
    action: action,
    employeeId: faceResult.employeeId,
    employeeName: faceResult.employeeName,
    latitude: latitude,
    longitude: longitude
  });
}

async function processFaceScan() {
  if (!appReady || busy || waitingForFaceToLeave || autoScanStopped) return;
  if (Date.now() - lastScanTime < SCAN_COOLDOWN) return;

  busy = true;
  lastScanTime = Date.now();

  try {
    const detection = await faceapi
      .detectSingleFace(
        video,
        new faceapi.TinyFaceDetectorOptions({
          inputSize: 320,
          scoreThreshold: 0.5
        })
      )
      .withFaceLandmarks(true)
      .withFaceDescriptor();

    // No face = no failed attempt. Just ask the employee to face the camera.
    if (!detection) {
      setStatus(
        "📷 <b>Face not detected.</b><br>🙂 Please bring your face in front of the camera."
      );
      busy = false;
      return;
    }

    setStatus("🔍 Face detected. Verifying...");

    const faceResult = await verifyFace(Array.from(detection.descriptor));

    if (!faceResult.success) {
      faceAttempts++;

      if (faceAttempts < MAX_FACE_ATTEMPTS) {
        const remaining = MAX_FACE_ATTEMPTS - faceAttempts;
        setStatus(
          "❌ <b>Face verification failed</b><br>" +
          escapeHtml(faceResult.message || "Face not recognised.") +
          "<br><br>🔄 Please face the camera again." +
          "<br><b>Attempt " + faceAttempts + " of " + MAX_FACE_ATTEMPTS + "</b>" +
          "<br>" + remaining + " attempt(s) remaining.",
          "error"
        );
      } else {
        document.getElementById("manualBtn").style.display = "block";
        autoScanStopped = true;
        setStatus(
          "❌ <b>Face verification failed 3 times.</b><br>" +
          "🆘 Manual Verification is now available.",
          "error"
        );
      }

      waitingForFaceToLeave = true;
      noFaceSince = 0;
      busy = false;
      return;
    }

    faceAttempts = 0;
    document.getElementById("manualBtn").style.display = "none";

    setStatus(
      "✅ Face verified.<br><b>" +
      escapeHtml(faceResult.employeeName) +
      "</b><br>📍 Checking office location..."
    );

    const position = await getLocation();
    const latitude = position.coords.latitude;
    const longitude = position.coords.longitude;

    const distance = calculateDistance(
      latitude,
      longitude,
      OFFICE_LAT,
      OFFICE_LNG
    );

    if (distance > ALLOWED_RADIUS) {
      setStatus(
        "❌ <b>Outside office location</b><br>" +
        "Distance: " + Math.round(distance) + " metres<br>" +
        "Allowed: " + ALLOWED_RADIUS + " metres",
        "error"
      );
      waitingForFaceToLeave = true;
      busy = false;
      return;
    }

    const result = await autoMarkAttendance(
      faceResult,
      latitude,
      longitude,
      distance
    );

    if (result.alreadyComplete) {
      setStatus(
        "ℹ️ <b>Attendance already completed today.</b><br>" +
        escapeHtml(faceResult.employeeName),
        "success"
      );
    } else if (result.success) {
      const isCheckIn = result.message && /check.?in/i.test(result.message);
      setStatus(
        "✅ <b>" + (isCheckIn ? "CHECK-IN" : "CHECK-OUT") +
        " SUCCESSFUL!</b><br><br>" +
        "Employee: " + escapeHtml(faceResult.employeeName) + "<br>" +
        "Time: " + escapeHtml(result.time || "") +
        (result.workingHours ? "<br>Working Hours: " + escapeHtml(result.workingHours) : "") +
        "<br>Distance: " + escapeHtml(String(result.distance || Math.round(distance))) + " m",
        "success"
      );
    } else {
      setStatus(
        "❌ " + escapeHtml(result.message || "Attendance failed."),
        "error"
      );
    }

    // Require the employee to move away and then face the camera again.
    waitingForFaceToLeave = true;
    noFaceSince = 0;

  } catch (error) {
    console.error(error);
    setStatus("❌ " + escapeHtml(error.message), "error");
    waitingForFaceToLeave = true;
    noFaceSince = 0;
  } finally {
    busy = false;
  }
}

async function monitorFaceLeave() {
  if (!waitingForFaceToLeave || busy || !appReady) return;

  try {
    const detection = await faceapi.detectSingleFace(
      video,
      new faceapi.TinyFaceDetectorOptions({
        inputSize: 320,
        scoreThreshold: 0.5
      })
    );

    if (!detection) {
      if (!noFaceSince) noFaceSince = Date.now();

      if (Date.now() - noFaceSince >= 1000) {
        waitingForFaceToLeave = false;
        noFaceSince = 0;
        setStatus("📷 <b>Ready for next scan.</b><br>Face the camera again.");
      }
    } else {
      noFaceSince = 0;
    }
  } catch (error) {
    console.warn("Face leave check:", error);
  }
}

function startAutoFaceScan() {
  if (scanTimer) clearInterval(scanTimer);

  scanTimer = setInterval(async () => {
    if (autoScanStopped) return;
    if (waitingForFaceToLeave) {
      await monitorFaceLeave();
    } else {
      await processFaceScan();
    }
  }, SCAN_INTERVAL);
}

async function manualVerification() {
  if (busy) return;

  if (faceAttempts < MAX_FACE_ATTEMPTS) {
    setStatus(
      "❌ Please try face verification 3 times first.",
      "error"
    );
    return;
  }

  const employeeId = prompt("Enter your Employee ID:");

  if (!employeeId || !employeeId.trim()) {
    return;
  }

  const cleanEmployeeId = employeeId.trim().toUpperCase();

  const confirmCheckIn = confirm(
    "Click OK for CHECK IN.\\n\\nClick Cancel for CHECK OUT."
  );

  const action = confirmCheckIn ? "checkIn" : "checkOut";
  const actionName = confirmCheckIn ? "Check In" : "Check Out";

  busy = true;
  try {
    setStatus("📍 Checking your office location...");

    const position = await getLocation();

    const latitude = position.coords.latitude;
    const longitude = position.coords.longitude;

    const distance = calculateDistance(
      latitude,
      longitude,
      OFFICE_LAT,
      OFFICE_LNG
    );

    if (distance > ALLOWED_RADIUS) {
      setStatus(
        "❌ <b>Outside office location</b><br>" +
        "Distance: " + Math.round(distance) + " metres<br>" +
        "Allowed: " + ALLOWED_RADIUS + " metres",
        "error"
      );
      return;
    }

    setStatus("🔎 Checking Employee ID...");

    const employeeResponse = await fetch(
      APPS_SCRIPT_URL +
      "?action=getEmployee&employeeId=" +
      encodeURIComponent(cleanEmployeeId)
    );

    const employeeText = await employeeResponse.text();

    let employeeResult;

    try {
      employeeResult = JSON.parse(employeeText);
    } catch (error) {
      console.error("Employee lookup response:", employeeText);
      throw new Error("Invalid response from attendance server.");
    }

    if (!employeeResult.success) {
      setStatus(
        "❌ <b>Employee ID not found</b><br>" +
        escapeHtml(employeeResult.message || "Please enter a valid Employee ID."),
        "error"
      );
      return;
    }

    const employeeName = employeeResult.employeeName || "";

    setStatus("⏳ Sending manual verification request...");

    const result = await postData({
      action: "manualRequest",
      employeeId: cleanEmployeeId,
      employeeName: employeeName,
      type: action,
      latitude: latitude,
      longitude: longitude
    });

    if (result.success) {
      setStatus(
        "✅ <b>MANUAL VERIFICATION REQUEST SENT</b><br><br>" +
        "Employee: " + escapeHtml(employeeName) + "<br>" +
        "Type: " + escapeHtml(actionName) + "<br>" +
        "Request ID: " + escapeHtml(result.requestId || "") + "<br>" +
        "Distance: " + escapeHtml(String(result.distance || Math.round(distance))) + " m<br><br>" +
        "Please wait for admin approval.",
        "success"
      );
    } else {
      setStatus(
        "❌ " + escapeHtml(result.message || "Manual request failed."),
        "error"
      );
    }

  } catch (error) {
    console.error(error);
    setStatus("❌ " + escapeHtml(error.message), "error");
  } finally {
    busy = false;

  }
}

function calculateDistance(lat1, lon1, lat2, lon2) {
  const R = 6371000;

  const dLat = (lat2 - lat1) * Math.PI / 180;
  const dLon = (lon2 - lon1) * Math.PI / 180;

  const a =
    Math.sin(dLat / 2) * Math.sin(dLat / 2) +
    Math.cos(lat1 * Math.PI / 180) *
    Math.cos(lat2 * Math.PI / 180) *
    Math.sin(dLon / 2) *
    Math.sin(dLon / 2);

  const c =
    2 * Math.atan2(
      Math.sqrt(a),
      Math.sqrt(1 - a)
    );

  return R * c;
}

function escapeHtml(value) {
  return String(value)
    .replace(/&/g, "&amp;")
    .replace(/</g, "&lt;")
    .replace(/>/g, "&gt;")
    .replace(/"/g, "&quot;")
    .replace(/'/g, "&#039;");
}

window.addEventListener("beforeunload", () => {
  if (scanTimer) clearInterval(scanTimer);
  if (cameraStream) {
    cameraStream.getTracks().forEach(track => track.stop());
  }
});

window.addEventListener("load", initialise);
</script>
