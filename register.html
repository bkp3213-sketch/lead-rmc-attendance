<!DOCTYPE html>
<html lang="en">

<head>
<meta charset="UTF-8">

<meta name="viewport"
      content="width=device-width, initial-scale=1.0">

<title>LEAD RMC - Face Registration</title>

<!-- Face API -->
<script src="https://cdn.jsdelivr.net/npm/@vladmandic/face-api@1.7.15/dist/face-api.js"></script>

<style>

* {
  box-sizing: border-box;
  font-family: Arial, sans-serif;
}

body {
  margin: 0;
  min-height: 100vh;
  background: #f4f6f8;
  display: flex;
  justify-content: center;
  align-items: center;
  padding: 20px;
}

.card {
  width: 100%;
  max-width: 430px;
  background: white;
  padding: 25px;
  border-radius: 20px;
  box-shadow: 0 8px 30px rgba(0,0,0,0.12);
  text-align: center;
}

h1 {
  margin: 0;
  font-size: 30px;
  color: #111;
}

.subtitle {
  color: #777;
  margin-top: 6px;
  margin-bottom: 20px;
  font-size: 17px;
}

label {
  display: block;
  text-align: left;
  font-weight: bold;
  margin-bottom: 6px;
}

input {
  width: 100%;
  padding: 14px;
  margin-bottom: 10px;
  border: 1px solid #ddd;
  border-radius: 10px;
  font-size: 16px;
  outline: none;
  text-transform: uppercase;
}

input:focus {
  border-color: #1976d2;
}

.nameBox {
  width: 100%;
  padding: 14px;
  margin-bottom: 12px;
  background: #f1f3f5;
  border: 1px solid #ddd;
  border-radius: 10px;
  font-size: 16px;
  text-align: left;
  color: #555;
}

video {
  width: 100%;
  margin-top: 8px;
  border-radius: 15px;
  background: #111;
  transform: scaleX(-1);
  display: block;
}

button {
  width: 100%;
  padding: 15px;
  margin-top: 15px;
  border: none;
  border-radius: 10px;
  background: #1976d2;
  color: white;
  font-size: 16px;
  font-weight: bold;
  cursor: pointer;
}

button:disabled {
  background: #aaa;
}

.closeBtn {
  background: #555;
}

#status {
  margin-top: 16px;
  line-height: 1.5;
  font-size: 15px;
}

.success {
  color: #16803c;
}

.error {
  color: #d93025;
}

.hidden {
  display: none;
}

.small {
  margin-top: 12px;
  font-size: 13px;
  color: #777;
}

iframe {
  display: none;
}

</style>
</head>

<body>

<div class="card">

  <h1>LEAD RMC</h1>

  <div class="subtitle">
    Employee Face Registration
  </div>

  <!-- EMPLOYEE ID -->
  <label for="employeeId">
    Employee ID
  </label>

  <input
    type="text"
    id="employeeId"
    placeholder="Enter Employee ID"
    autocomplete="off">

  <!-- EMPLOYEE NAME -->
  <div id="employeeName" class="nameBox">
    Employee Name will appear here
  </div>

  <!-- CAMERA -->
  <video
    id="video"
    autoplay
    muted
    playsinline>
  </video>

  <!-- REGISTER BUTTON -->
  <button
    id="captureBtn"
    onclick="registerFace()"
    disabled>
    CREATE FACE ID
  </button>

  <!-- STATUS -->
  <div id="status">
    ⏳ Loading face recognition...
  </div>

  <div class="small">
    Enter Employee ID and look directly at the camera.
  </div>

  <!-- CLOSE BUTTON -->
  <button
    id="closeBtn"
    class="closeBtn hidden"
    onclick="closePage()">
    CLOSE
  </button>

</div>

<!-- HIDDEN IFRAME -->
<iframe
  name="appsScriptFrame"
  id="appsScriptFrame">
</iframe>

<!-- HIDDEN FORM -->
<form
  id="registrationForm"
  method="POST"
  target="_blank">

  <input
    type="hidden"
    name="action"
    value="registerEmployee">

  <input
    type="hidden"
    name="employeeId"
    id="formEmployeeId">

  <input
    type="hidden"
    name="descriptor"
    id="formDescriptor">

</form>

<script>

const APPS_SCRIPT_URL =
"https://script.google.com/macros/s/AKfycbwVkeLVCtXD9GW42p9V7BZ-ST6p60LfrD6koc4p8D4u035hKaoB7dgFSUNG_XidBOfi/exec";

/*
  Two model sources.
  If jsDelivr does not load on mobile, the page automatically
  tries UNPKG.
*/
const MODEL_URLS = [
  "https://cdn.jsdelivr.net/npm/@vladmandic/face-api@1.7.15/model/",
  "https://unpkg.com/@vladmandic/face-api@1.7.15/model/"
];

let cameraStream = null;
let employeeFound = false;
let currentEmployeeName = "";


/* =========================================
   LOAD FACE MODELS
========================================= */

function withTimeout(promise, milliseconds) {

  const timeout = new Promise((_, reject) => {

    setTimeout(() => {
      reject(
        new Error("Model loading timed out")
      );
    }, milliseconds);

  });

  return Promise.race([
    promise,
    timeout
  ]);
}


async function loadModelsFrom(url) {

  await withTimeout(
    faceapi.nets.tinyFaceDetector.loadFromUri(url),
    15000
  );

  await withTimeout(
    faceapi.nets.faceLandmark68TinyNet.loadFromUri(url),
    15000
  );

  await withTimeout(
    faceapi.nets.faceRecognitionNet.loadFromUri(url),
    20000
  );
}


async function loadFaceModels() {

  const status =
    document.getElementById("status");

  let loaded = false;
  let lastError = null;

  for (let i = 0; i < MODEL_URLS.length; i++) {

    try {

      if (i === 0) {

        status.innerHTML =
          "⏳ Loading face detector...";

      } else {

        status.innerHTML =
          "🔄 Trying alternate face model server...";
      }


      await loadModelsFrom(
        MODEL_URLS[i]
      );

      loaded = true;
      break;

    } catch (error) {

      console.error(
        "Model source failed:",
        MODEL_URLS[i],
        error
      );

      lastError = error;
    }
  }


  if (!loaded) {

    console.error(lastError);

    status.innerHTML =
      "❌ Face recognition could not be loaded.<br>" +
      "Please check your internet connection and reload the page.";

    return;
  }


  status.innerHTML =
    "📷 Starting camera...";


  await startCamera();

}


/* =========================================
   START CAMERA
========================================= */

async function startCamera() {

  const status =
    document.getElementById("status");

  try {

    if (!navigator.mediaDevices ||
        !navigator.mediaDevices.getUserMedia) {

      throw new Error(
        "Camera is not supported by this browser."
      );
    }


    cameraStream =
      await navigator.mediaDevices.getUserMedia({

        video: {
          facingMode: "user",

          width: {
            ideal: 640
          },

          height: {
            ideal: 480
          }
        },

        audio: false

      });


    const video =
      document.getElementById("video");


    video.srcObject =
      cameraStream;


    await video.play();


    document.getElementById(
      "captureBtn"
    ).disabled = false;


    status.innerHTML =
      "✅ Camera ready.<br>" +
      "Enter Employee ID.";


  } catch (error) {

    console.error(error);

    status.innerHTML =
      "❌ Camera permission required.<br>" +
      error.message;
  }
}


/* =========================================
   GET EMPLOYEE NAME
========================================= */

async function getEmployeeName() {

  const employeeId =
    document
      .getElementById("employeeId")
      .value
      .trim()
      .toUpperCase();


  const nameBox =
    document.getElementById("employeeName");


  const status =
    document.getElementById("status");


  if (!employeeId) {

    employeeFound = false;

    currentEmployeeName = "";

    nameBox.innerText =
      "Employee Name will appear here";

    return;
  }


  status.innerHTML =
    "🔍 Checking Employee ID...";


  employeeFound = false;

  currentEmployeeName = "";


  try {

    const response =
      await fetch(
        APPS_SCRIPT_URL +
        "?action=getEmployee&employeeId=" +
        encodeURIComponent(employeeId)
      );


    const result =
      await response.json();


    if (result.success) {

      employeeFound = true;

      currentEmployeeName =
        result.employeeName;


      nameBox.innerText =
        "Employee Name: " +
        result.employeeName;


      status.innerHTML =
        "✅ Employee found.<br>" +
        "You can create Face ID.";

    } else {

      employeeFound = false;

      currentEmployeeName = "";

      nameBox.innerText =
        "❌ Employee not found";

      status.innerHTML =
        "❌ " +
        result.message;
    }


  } catch (error) {

    console.error(error);

    employeeFound = false;

    currentEmployeeName = "";

    nameBox.innerText =
      "⚠️ Unable to verify Employee";

    status.innerHTML =
      "⚠️ Unable to verify Employee ID.";
  }
}


/* =========================================
   EMPLOYEE ID CHANGE
========================================= */

document
  .getElementById("employeeId")
  .addEventListener(
    "input",
    function() {

      this.value =
        this.value.toUpperCase();

      clearTimeout(
        window.employeeTimer
      );

      window.employeeTimer =
        setTimeout(
          getEmployeeName,
          500
        );
    }
  );


/* =========================================
   REGISTER FACE
========================================= */

async function registerFace() {

  const employeeId =
    document
      .getElementById("employeeId")
      .value
      .trim()
      .toUpperCase();


  const status =
    document.getElementById("status");


  const button =
    document.getElementById("captureBtn");


  if (!employeeId) {

    status.innerHTML =
      "⚠️ Enter Employee ID.";

    return;
  }


  if (!employeeFound) {

    status.innerHTML =
      "❌ Employee ID not found.";

    return;
  }


  if (!currentEmployeeName) {

    status.innerHTML =
      "❌ Employee name not found.";

    return;
  }


  button.disabled = true;

  button.innerText =
    "SCANNING...";


  status.innerHTML =
    "📷 Detecting face...";


  try {

    const video =
      document.getElementById("video");


    const detection =
      await faceapi
        .detectSingleFace(
          video,
          new faceapi.TinyFaceDetectorOptions({
            inputSize: 320,
            scoreThreshold: 0.5
          })
        )
        .withFaceLandmarks(true)
        .withFaceDescriptor();


    if (!detection) {

      status.innerHTML =
        "❌ Face not detected.<br>" +
        "Keep your face clearly visible.";

      button.disabled = false;

      button.innerText =
        "CREATE FACE ID";

      return;
    }


    const descriptor =
      Array.from(
        detection.descriptor
      );


    status.innerHTML =
      "✅ Face detected.<br>" +
      "💾 Saving Face ID...";


    document.getElementById(
      "formEmployeeId"
    ).value =
      employeeId;


    document.getElementById(
      "formDescriptor"
    ).value =
      JSON.stringify(descriptor);


    button.innerText =
      "SAVING...";


    const form =
      document.getElementById(
        "registrationForm"
      );


    form.action =
      APPS_SCRIPT_URL;


    /*
      target="_blank" opens the Apps Script
      success/failure page in a new tab.
    */
    form.submit();


  } catch (error) {

    console.error(error);

    status.innerHTML =
      "❌ Face registration failed.<br>" +
      error.message;

    button.disabled = false;

    button.innerText =
      "CREATE FACE ID";
  }
}


/* =========================================
   CLOSE PAGE
========================================= */

function closePage() {

  if (cameraStream) {

    cameraStream
      .getTracks()
      .forEach(
        track =>
          track.stop()
      );
  }


  window.close();

}


/* =========================================
   START
========================================= */

window.addEventListener(
  "load",
  loadFaceModels
);

</script>

</body>
</html>
